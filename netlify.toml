[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Real admin authentication endpoint (must stay ABOVE the SPA fallback).
[[redirects]]
  from = "/api/admin-auth/*"
  to = "/.netlify/functions/admin-auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
